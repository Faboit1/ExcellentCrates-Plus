name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install NightCore to local Maven repo
        run: |
          mvn install:install-file \
            -Dfile=libs/nightcore-2.10.0-shaded.jar \
            -DgroupId=su.nightexpress.nightcore \
            -DartifactId=main \
            -Dversion=2.10.0 \
            -Dclassifier=shaded \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ExcellentCrates-Plus
          path: target/ExcellentCrates-*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install NightCore to local Maven repo
        run: |
          mvn install:install-file \
            -Dfile=libs/nightcore-2.10.0-shaded.jar \
            -DgroupId=su.nightexpress.nightcore \
            -DartifactId=main \
            -Dversion=2.10.0 \
            -Dclassifier=shaded \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Get version
        id: version
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-build.${{ github.run_number }}
          name: Build ${{ github.run_number }} (v${{ steps.version.outputs.version }})
          files: target/ExcellentCrates-${{ steps.version.outputs.version }}.jar
          generate_release_notes: true
